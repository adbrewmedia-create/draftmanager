<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft Manager</title>
<meta name="description" content="Spin World Cup, Premier League and rugby history, draft a team on a budget, and keep your stars fit.">
<meta name="theme-color" content="#d9141b">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Draft Manager">
<meta property="og:description" content="Spin World Cup, Premier League and rugby history, draft a team on a budget, and keep your stars fit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f3f3; --panel:#ffffff; --panel2:#ececec; --line:rgba(20,20,20,.12);
  --ink:#1a1a1a; --muted:#666a70; --accent:#d9141b; --accent-ink:#ffffff;
  --good:#1f9d57; --bad:#d9141b; --warn:#b36a00;
  --pitch:#2e8b57; --pitchline:rgba(255,255,255,.45);
  --r-gold:#e7b416; --r-green:#3cb371; --r-blue:#4a90e2; --r-gray:#9aa0a6; --orb-ink:#10231a;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
.app{--pad:16px;max-width:520px;margin:0 auto;padding:0 var(--pad) 56px}
.muted{color:var(--muted)} .small{font-size:12.5px}

.nav{display:flex;justify-content:space-between;align-items:center;margin:0 calc(var(--pad)*-1);padding:16px var(--pad);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em}
.links{display:flex;gap:16px;font-size:13px;font-weight:600}
.links a{color:var(--ink);text-decoration:none;opacity:.75;padding-bottom:3px}
.links a.on{color:var(--accent);opacity:1;border-bottom:2px solid var(--accent)}
.big{font-size:clamp(40px,12vw,58px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:36px 0 14px}
.lead{color:var(--muted);margin:0;max-width:34ch}
.lbl2{font-size:13px;font-weight:700;display:block;margin:26px 0 8px}
.inrow{display:flex;gap:8px}
.inrow .inp{flex:1;min-width:0}
.inrow .btn{width:auto;padding:0 22px;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.hstep{padding:10px 0;display:flex;flex-direction:column;gap:2px}
.hstep b{font-size:15px}
.hstep span{color:var(--muted);font-size:13.5px}
.dd{border-top:1px solid var(--line);padding:14px 0}
.dd:last-child{border-bottom:1px solid var(--line)}
#play .dd{border-bottom:0}
.dd summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"+";color:var(--muted);font-size:18px;font-weight:500}
.dd[open] summary::after{content:"–"}
.dd > :not(summary){margin-top:14px}
.inp{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;font-size:15px;outline:0}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.or{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 10px}

.btn{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%;letter-spacing:-.01em}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad);color:#2a0a05}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.mini{border:0;background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}

.top{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.namebar{flex:1;min-width:0}
.namebar input{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);font-size:20px;font-weight:800;letter-spacing:-.02em;outline:0;padding:2px 0}
.namebar input:focus{border-bottom-color:var(--accent)}
.namebar input::placeholder{color:var(--muted);font-weight:600}
.statsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:0 calc(var(--pad)*-1);padding:10px var(--pad);border-bottom:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat b{font-size:16px;letter-spacing:-.01em}
.stat.hi b{color:var(--accent)}
.chip{display:inline-block;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin:0 6px 0 0}
.reward{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-radius:12px;padding:10px 14px;margin-top:12px}
.game{display:block}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

.pitch{position:relative;aspect-ratio:1/1.08;border-radius:14px;overflow:hidden;background:var(--pitch);margin-top:12px}
.ln{position:absolute;border:1.5px solid var(--pitchline);pointer-events:none}
.ln.mid{left:0;right:0;top:50%;height:0;border-width:1.5px 0 0}
.ln.circ{width:24%;aspect-ratio:1;border-radius:50%;left:38%;top:calc(50% - 12%*1.08)}
.ln.boxT{left:26%;right:26%;top:0;height:15%;border-top:0}
.ln.boxB{left:22%;right:22%;bottom:0;height:20%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:64px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);font:inherit}
.orb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--orb-ink)}
.orb.sm{width:28px;height:28px;font-size:13px}
.orb.ghost{background:rgba(243,241,226,.08);border:1.5px dashed rgba(243,241,226,.35);color:var(--ink);opacity:.7;font-size:11px;font-weight:700}
.r-gold{background:var(--r-gold)} .r-green{background:var(--r-green)} .r-blue{background:var(--r-blue)} .r-gray{background:var(--r-gray)}
.nm{font-size:10px;font-weight:700;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.elig .orb{animation:glow 1s infinite alternate;outline:2px solid var(--accent);outline-offset:2px}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(244,249,143,.7)}to{box-shadow:0 0 0 9px rgba(244,249,143,0)}}
.slot.inj .orb{opacity:.55;outline:2px solid var(--bad);outline-offset:2px}
.badge{position:absolute;top:-6px;right:-10px;font-size:10px;background:var(--bad);color:#2a0a05;border-radius:9px;padding:0 5px;font-weight:800;line-height:16px}

.card{background:var(--panel);border-radius:16px;padding:18px;margin-top:12px}
.card h2{font-size:18px;letter-spacing:-.02em;margin:0 0 8px}
.bar{height:5px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.odds{display:flex;height:5px;border-radius:4px;overflow:hidden;margin-top:6px}
.odds i{display:block;height:100%}
.fm{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;font-size:10px;font-weight:800;margin-right:3px;color:#0d2a21}
.fW{background:var(--good)} .fD{background:var(--muted)} .fL{background:var(--bad)}
.xirow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.xp{font-size:12px;background:var(--panel2);border-radius:8px;padding:3px 8px;white-space:nowrap}
.xp.out{background:transparent;box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.pos{font-size:11px;font-weight:700;color:var(--muted)}

.reels{display:flex;gap:8px}
.reel{flex:2;background:var(--panel2);border-radius:12px;padding:16px 10px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reel.sm{flex:1}
.reels.spin .reel{animation:flick .12s infinite alternate}
.reels.landed .reel{color:var(--accent)}
@keyframes flick{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
.prow{display:grid;grid-template-columns:36px 28px 1fr auto;gap:2px 10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.prow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.prow.dis{opacity:.4;cursor:not-allowed}
.pn{font-weight:700}
.pr{font-weight:800;text-align:right}
.hid{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;grid-column:2/-1}

.era-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 18px}
.era-chip{border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);border-radius:10px;padding:10px 2px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.15}
.era-chip.on{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.era-range{position:relative;height:26px;margin:0 10px}
.era-track{position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:var(--panel2)}
.era-fill{position:absolute;top:10px;height:6px;border-radius:3px;background:var(--accent)}
.era-range input{position:absolute;left:-10px;width:calc(100% + 20px);top:0;height:26px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;outline:0}
.era-range input::-webkit-slider-runnable-track{background:none;height:26px}
.era-range input::-moz-range-track{background:none}
.era-range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:20px;height:20px;margin-top:3px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);cursor:pointer}
.era-range input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);cursor:pointer}
.era-lbls{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.era-lbls b{color:var(--accent);font-size:14px}

.score{display:flex;justify-content:center;align-items:center;gap:18px;font-size:42px;font-weight:800;letter-spacing:-.03em;margin:10px 0}
.score small{font-size:12px;font-weight:600;color:var(--muted);display:block;text-align:center;letter-spacing:0}
.ev{font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.res{font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;color:#0d2a21}
.res.W{background:var(--good)} .res.D{background:var(--muted)} .res.L{background:var(--bad)}
.perf{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.perf:first-child{border-top:0}
.lb{display:flex;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:14px}
.lb.me{background:var(--panel2);font-weight:800}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);padding:10px;border-radius:10px;word-break:break-all;user-select:all}

.overlay{position:fixed;inset:0;background:rgba(5,20,15,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:520px;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.sheet .opt{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:20;max-width:90%;text-align:center}

@media (min-width:900px){
  .app.wide{--pad:28px;max-width:1120px}
  .app.wide .top .namebar{max-width:420px}
  .game{display:grid;grid-template-columns:minmax(380px,5fr) minmax(0,6fr);gap:24px;align-items:start}
  .col-pitch{position:sticky;top:76px}
  .col-pitch .pitch{width:min(100%,calc((100vh - 280px)/var(--pr,1.1)));margin:12px auto 0}
  .col-side>.card:first-child{margin-top:12px}
}

/* ===== layout: full-width pages (home, setup, lobby, end) ===== */
.app{max-width:640px;padding:0 var(--pad) 56px}
.app.home{max-width:none;padding:0;--pad:20px}
.app.page{max-width:640px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}
.nav{margin:0;padding:0;border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:16px;padding-bottom:16px}
.hero{display:grid;grid-template-columns:1fr;gap:32px;padding:36px 0 44px}
.hero .big{margin:0 0 16px}
.hero .lead{font-size:17px;max-width:38ch}
.stage{display:none}
.how{display:grid;grid-template-columns:1fr;gap:18px;border-top:1px solid var(--line);padding:30px 0}
.how h2{font-size:28px;letter-spacing:-.03em;margin:0}
.how .hstep{padding:0}
.how .card{margin-top:0}
.how + .how{border-bottom:1px solid var(--line)}
.foot{display:flex;justify-content:flex-end;padding:22px 0 56px}
.foot a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}
.cols{display:block}
.setup .big{font-size:clamp(40px,10vw,64px)}

/* sample card on the home page */
.pcard{position:absolute;left:50%;top:50%;width:280px;height:380px;margin:-190px 0 0 -140px;transform:rotate(-4deg);background:#ecedd8;color:#133d31;border-radius:18px;padding:18px 20px;box-shadow:12px 16px 0 rgba(0,0,0,.18)}
.pcard .r{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pcard .p{font-size:12px;font-weight:800;margin-top:2px}
.pcard svg{display:block;margin:6px auto 0}
.pcard .n{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.pcard .s{font-size:12px;opacity:.65;margin-top:2px}
.btag{position:absolute;right:0;bottom:56px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:6px;transform:rotate(4deg)}
.btag small{display:block;font-size:11px;font-weight:700}
.btag b{font-size:34px;letter-spacing:-.03em}
.frame{position:absolute;inset:44px 24px 24px 12px;border:1px solid var(--line);transform:rotate(-3deg)}
.frame::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.frame::after{content:"";position:absolute;left:30%;right:30%;top:0;height:20%;border:1px solid var(--line);border-top:0}
.st-title{position:absolute;left:30px;top:6px}
.st-title b{font-size:26px;letter-spacing:-.03em}
.st-title div{font-size:12px;color:var(--muted)}

@media (min-width:900px){
  .app{--pad:32px}
  .app.home{--pad:32px}
  .app.wide{max-width:1320px}
  .app.page{max-width:1240px}
  .hero{grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:64px 0 72px;min-height:600px}
  .hero .big{font-size:clamp(56px,6.4vw,92px)}
  .hero .lead{font-size:19px}
  .stage{display:block;position:relative;height:540px}
  .how{grid-template-columns:1fr repeat(3,1fr);gap:36px;align-items:start;padding:44px 0}
  .how.friends{grid-template-columns:1fr 1.2fr 1.2fr}
  .cols{display:grid;grid-template-columns:5fr 6fr;gap:40px;align-items:start}
  .cols > .card:first-child, .cols > div > .card:first-child{margin-top:20px}
}

.nav{display:block}
.inrow{align-items:stretch}
.inrow .btn{min-height:48px}
@media (min-width:900px){
  .cols.setup{min-height:calc(100vh - 150px);align-items:center}
  .cols.setup > .card{margin-top:0}
}

.inrow{align-items:center}
.inrow .inp,.inrow .btn{height:52px;min-height:52px;padding-top:0;padding-bottom:0}

/* ===== brand palette: white / near-black / red, heavy display type ===== */
html,body{background:var(--bg)}
.app.home{background:linear-gradient(180deg,#fafafa 0,#ececec 100%)}
.big{font-family:var(--display);text-transform:uppercase;font-weight:400;letter-spacing:.005em;line-height:1.06}
.big .red{color:var(--accent)}
.hero .big{font-size:clamp(38px,9.5vw,60px)}
@media (min-width:900px){.hero .big{font-size:clamp(46px,5vw,76px)}}
.brand{font-family:var(--display);font-style:italic;font-weight:400;font-size:17px;letter-spacing:.01em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:400}
.nav{background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.links a{opacity:1;color:var(--ink)}
.links a.on{color:var(--accent);border-bottom-color:var(--accent)}
.how h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.01em}
.card{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06);border-radius:20px}
.card h2{font-weight:700}
.statsbar{background:rgba(243,243,243,.94);backdrop-filter:blur(8px)}
.reward{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05)}
.btn{border-radius:999px;text-transform:uppercase;letter-spacing:.04em;font-size:13.5px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(217,20,27,.28)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.btn.danger{background:var(--ink);color:#fff;box-shadow:none}
.btn:disabled{box-shadow:none}
.btn.sm{font-size:12px}
.mini{border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.inp{background:#fff;border-color:var(--line);border-radius:14px}
.inp:focus{border-color:var(--accent)}
.hint,.lead{color:var(--muted)}
.hstep b{font-weight:700}
.era-chip{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--ink);border-radius:999px}
.era-chip.on{background:var(--accent);color:#fff;box-shadow:none}
.era-track{background:#d9d9d9}
.era-range input::-webkit-slider-thumb{background:#fff;border-color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.era-range input::-moz-range-thumb{background:#fff;border-color:var(--accent)}
.reel{background:var(--panel2);color:var(--ink)}
.reels.landed .reel{color:var(--accent)}
.prow.sel{background:#fdeaea}
.lb.me{background:#fdeaea}
.xp{background:var(--panel2)}
.res,.fm{color:#fff}
.fD{background:#8d9298}
.bar{background:#e3e3e3}
.sheet{background:#fff}
.overlay{background:rgba(10,10,10,.5)}
.toast{background:var(--ink);color:#fff}
.linkbox{background:var(--panel2)}
/* pitch keeps its own light-on-green colours */
.pitch .slot{color:#fff}
.pitch .orb.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.65);color:#fff;opacity:1}
.pitch .nm{text-shadow:0 1px 2px rgba(0,0,0,.45)}
.slot.elig .orb{outline-color:#fff;animation:glow2 1s infinite alternate}
@keyframes glow2{from{box-shadow:0 0 0 0 rgba(255,255,255,.8)}to{box-shadow:0 0 0 9px rgba(255,255,255,0)}}
.badge{background:var(--accent);color:#fff}
/* home sample */
.frame{inset:30px 40px 24px 70px;border:0;border-radius:42% 58% 50% 50% / 38% 42% 58% 62%;background:linear-gradient(160deg,#e3231f,#a50c0c);box-shadow:0 30px 60px rgba(217,20,27,.28);transform:none}
.frame::before,.frame::after{display:none}
.pcard{background:#fff;color:var(--ink);box-shadow:0 24px 50px rgba(0,0,0,.28);transform:rotate(-3deg)}
.pcard svg path:first-child{fill:var(--accent)}
.pcard svg path+path{stroke:#fff}
.pcard svg text{fill:#fff}
.btag{background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:none;right:6px;bottom:48px;max-width:260px}
.btag b{font-size:16px;letter-spacing:-.01em;display:block}
.btag small{display:block;margin-top:2px;font-weight:500;color:var(--muted)}

/* heavy display type: real bold if the web font fails, no faux-bold when it loads */
.big,.brand,.how h2{font-weight:800;font-synthesis-weight:none}
.brand b{font-weight:800}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{text-align:left;background:#fff;border:0;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:16px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35}
.mode.on{box-shadow:inset 0 0 0 2px var(--accent)}
.mode.on b{color:var(--accent)}

/* popups: centred on screen */
.overlay{align-items:center;justify-content:center;padding:16px}
.sheet{max-width:440px;border-radius:22px;border-top:0;padding:22px;max-height:calc(100% - 32px);box-shadow:0 24px 60px rgba(0,0,0,.35)}

.pkrow{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.pkrow>div{display:flex;gap:6px;flex-wrap:wrap}
.pk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;color:#fff}
.pk.g{background:var(--good)} .pk.x{background:var(--bad)} .pk.w{background:var(--panel2)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;box-shadow:none}
.lbwrap{max-width:760px;margin:0 auto}
.lbrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 8px;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}
.lbrow.me{background:#fdeaea;border-radius:12px;border-top-color:transparent}
.lbr{font-weight:800;font-size:18px;color:var(--muted)}
.lbrow:nth-child(-n+3) .lbr{color:var(--accent)}
.lbn{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbs{font-weight:800;font-size:16px;text-align:right}
.links a{white-space:nowrap}

/* ===== pitch: editorial print ===== */
.pitch{aspect-ratio:1/1.1;background:#fff;border:1px solid var(--line);container-type:inline-size;border-radius:16px}
.pitch::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff 0 9.09%,#f6f6f6 9.09% 18.18%)}
.pitch svg.mk{position:absolute;inset:0;width:100%;height:100%}
.pitch svg.mk *{vector-effect:non-scaling-stroke;stroke-width:1.6px}
.pitch .slot{width:auto;display:flex;flex-direction:column;align-items:center;gap:.2cqw;color:#1a1a1a;background:none;border:0;padding:0;cursor:pointer}
.pitch .shirt{position:relative;width:13cqw;height:12cqw;display:block;transition:transform .12s}
.pitch .slot:hover .shirt{transform:translateY(-.6cqw)}
.pitch .shirt svg{width:100%;height:100%;display:block}
.pitch .shirt b{position:absolute;inset:0;display:grid;place-items:center;padding-top:1.2cqw;color:var(--orb-ink);font-size:4.2cqw;font-weight:800}
.pitch .nm{font-size:2.8cqw;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a1a1a;white-space:nowrap;max-width:20cqw;text-shadow:none}
.pitch .slot.empty .nm{color:#8a8d92}
.pitch .slot.elig .shirt{animation:pulseR 1.1s infinite alternate}
.pitch .slot.elig .nm{color:#d9141b}
.pitch .slot.inj .shirt{opacity:.45}
.pitch .slot .ib{position:absolute;right:-1.4cqw;top:-.6cqw;min-width:4.4cqw;height:4.4cqw;border-radius:2.2cqw;background:#d9141b;color:#fff;font-style:normal;font-weight:800;font-size:2.8cqw;line-height:4.4cqw;text-align:center;padding:0 .8cqw}
.pitch .slot{position:absolute}
@keyframes pulseR{from{filter:drop-shadow(0 0 0 rgba(217,20,27,.7))}to{filter:drop-shadow(0 0 1.6cqw rgba(217,20,27,.9))}}
.tierkey{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:10px 0 0;font-size:12px;font-weight:600;color:var(--muted)}
.tierkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pitch.rugby{aspect-ratio:1/1.22}
.pitch.rugby .shirt{width:10.5cqw;height:9.8cqw}
.pitch.rugby .shirt b{font-size:3.7cqw;padding-top:1cqw}
.pitch.rugby .nm{font-size:2.5cqw;max-width:22cqw}
.pitch.rugby .slot .ib{min-width:3.8cqw;height:3.8cqw;line-height:3.8cqw;font-size:2.4cqw}
</style>
</head>

function genSquad(nat, year){
  const r = mulberry(hash(nat.n+year));
  const rn = () => { let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const base = (nat.sf ? nat.sf(year) : nat.s) - 7 + rn()*3;
  const layout = nat.rugby ? RG_LAYOUT : FB_LAYOUT;
  const stars = new Set(); while(stars.size<(nat.rugby?3:2)) stars.add(Math.floor(r()*layout.length));
  const used = new Set(), players = [];
  layout.forEach((pos,i)=>{
    let name, pnat = nat;
    do {
      if(nat.club){   // club squads: each player has his own nationality, fewer English players over time
        const pe = clamp(.62-(year-1992)*.012,.18,.62);
        pnat = r()<pe ? NATS_WC.find(x=>x.n==='England') : NATS_WC[Math.floor(r()*NATS_WC.length)];
      }
      name = INITS[Math.floor(r()*INITS.length)]+' '+pnat.l[Math.floor(r()*pnat.l.length)];
    } while(used.has(name));
    used.add(name);
    const rating = clamp(Math.round(base + rn()*6 + (stars.has(i)?7:0)), 54, 94);
    const pb = 1 + Math.pow(Math.max(0,rating-55)/35, 2.2)*17;
    players.push({
      id:++uid, key:nat.n+'|'+year+'|'+name, name, pos, rating, nat:nat.n, flag:pnat.f, year,
      price: Math.max(1, Math.round(pb*(0.8+r()*0.45))),
      risk: (0.008 + Math.pow(r(),1.4)*0.05)*(nat.rugby?1.3:1),
      form: clamp(Math.round(rn()*1.1), -2, 2),
      revealed:false, inj:0, consec:0, pts:0, gp:0
    });
  });
  const ord = (nat.rugby?SPORTS.rugby:SPORTS.football).order;
  players.sort((a,b)=>ord[a.pos]-ord[b.pos] || b.rating-a.rating);
  return {nat, year, players};
}

function buildLineup(){
  const used = new Set(), en = [];
  MAIN.forEach(s=>{
    const p = S.squad[s.id];
    if(p && p.inj===0) en.push({slot:s,p,eff:p.rating*(1+0.01*p.form),cover:false});
    else en.push({slot:s,p:null,eff:p?55:40,cover:false,out:p||null});
  });
  en.forEach(e=>{
    if(e.p) return;
    const cands = BENCH.map(b=>S.squad[b.id]).filter(p=>p && p.inj===0 && !used.has(p.id));
    const sc = p => p.rating - (p.pos===e.slot.pos?0:6);
    cands.sort((a,b)=>sc(b)-sc(a));
    if(cands[0]){ const c=cands[0]; used.add(c.id); e.p=c; e.cover=true; e.eff=sc(c)*(1+0.01*c.form); }
  });
  return en;
}
function strengthRG(en){
  let f=0,fn=0,b=0,bn=0;
  en.forEach(e=>{ if(RG_FWD.includes(e.slot.pos)){f+=e.eff;fn++} else {b+=e.eff;bn++} });
  const F=f/fn, B=b/bn;
  return {att:.4*F+.6*B, def:.5*F+.5*B};
}
/* rugby scoring: tries (5) + conversions (2) + penalty goals (3) */
const EXP_RG = 3.5;
function poissonR(l,R){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=R()}while(p>L); return k-1; }
function rgPoints(att,defOpp,kick,R){
  R = R || rnd;
  const t = poissonR(clamp(2.6*Math.pow(att/defOpp,EXP_RG),.3,8),R);
  let c=0; for(let i=0;i<t;i++) if(R()<kick) c++;
  const p = poissonR(clamp(1.5*Math.pow(att/defOpp,2),.2,4),R);
  return {t,c,p,pts:t*5+c*2+p*3};
}
function matchOdds(st,o){
  if(SPORT.id!=='rugby') return odds(clamp(1.3*Math.pow(st.att/o.def,EXP),0.2,5.5), clamp(1.3*Math.pow(o.att/st.def,EXP),0.2,5.5));
  const R = mulberry(hash(Math.round(st.att*10)+'|'+Math.round(st.def*10)+'|'+Math.round(o.att*10)+'|'+Math.round(o.def*10)));
  let w=0,d=0,l=0; const N=1500;
  for(let i=0;i<N;i++){ const a=rgPoints(st.att,o.def,.72,R).pts, b=rgPoints(o.att,st.def,.72,R).pts; if(a>b)w++; else if(a===b)d++; else l++; }
  return {w:w/N,d:d/N,l:l/N};
}
function strength(en){
  if(SPORT.id==='rugby') return strengthRG(en);
  let fa=0,fn=0,ma=0,mn=0,d=0,dn=0,gk=40;
  en.forEach(e=>{
    const pos=e.slot.pos;
    if(pos==='FWD'){fa+=e.eff;fn++} else if(pos==='MID'){ma+=e.eff;mn++}
    else if(pos==='DEF'){d+=e.eff;dn++} else gk=e.eff;
  });
  return {att:(fa+ma*0.6)/(fn+mn*0.6), def:(gk*1.2+d+ma*0.3)/(1.2+dn+mn*0.3)};
}
function mkOpp(day){
  /* AI manager drafts under a budget that grows through the season */
  /* World Cup: gentle group draw, ramping through the knockouts. Season: unchanged. */
  const budget = S.format==='cup' ? ((S.startBudget||88)-24 + (day-1)*4.8 + rnd()*6) : ((S.startBudget||88)-6) + day*2.5 + rnd()*6;
  let left = budget; const xi = [];
  LAYOUT.forEach((pos,i)=>{
    const slotsLeft = LAYOUT.length-i-1;
    let c = [];
    for(let k=0;k<3;k++) c.push(...randSquad().players.filter(p=>p.pos===pos));
    c = c.filter(p=>p.price<=left-slotsLeft).map(p=>({p,sc:p.rating+rnd()*9})).sort((x,y)=>y.sc-x.sc);
    const p = c[0] ? c[0].p : {id:++uid,name:'R. Walker',pos,rating:60,price:1,nat:'England',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',year:pick(eraYears()),form:0,risk:.02,inj:0};
    left -= p.price;
    p.inj = (day>1 && rnd()<0.08) ? ri(1,3) : 0;
    xi.push(p);
  });
  const en = xi.map((p,i)=>({slot:{pos:LAYOUT[i]},p,eff:p.inj>0?56:p.rating*(1+0.01*p.form)}));
  const st = strength(en);
  const ovr = Math.round(xi.reduce((t,p)=>t+(p.inj>0?56:p.rating),0)/xi.length);
  const pw = clamp((ovr-60)/30+0.2,.15,.8);
  const form = Array.from({length:5},()=>{const r=rnd();return r<pw?'W':r<pw+0.15?'D':'L'}).join('');
  const fr = S.league ? S.league.members.filter(m=>!m.me) : [];
  const ct = (S.format==='cup' && S.cupTeams) ? S.cupTeams[(day-1)%S.cupTeams.length] : null;
  return {name: ct ? ct.f+' '+ct.n : fr.length ? fr[(day-1)%fr.length].n+"'s XI" : S.opps[(day-1)%S.opps.length], friend: fr.length>0, xi, att:st.att, def:st.def, ovr, form,
          cost:Math.round(xi.reduce((t,p)=>t+p.price,0))};
}
const EXP = 8;
const PAY = {W:6,D:3,L:2};          // cash per result
const REWARD_MS = 60000;            // mockup: 60s. Real game: 24h
const REWARD_CASH = 5;
function pmf(l,k){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function odds(lf,la){ let w=0,d=0,l=0; for(let a=0;a<14;a++) for(let b=0;b<14;b++){ const p=pmf(lf,a)*pmf(la,b); if(a>b)w+=p; else if(a===b)d+=p; else l+=p; } return {w,d,l}; }
function poisson(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=rnd()}while(p>L); return k-1; }
function weighted(list, w){
  const ws = list.map(w), tot = ws.reduce((a,b)=>a+b,0); let r = rnd()*tot;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}

function initCup(){

  const g = [1,2,3].map(d=>mkOpp(d));

  S.cup = {group:g, rows:[row('me','',true),row('A',g[0].name),row('B',g[1].name),row('C',g[2].name)], qualified:null, place:null, rank:0};

function addResult(r,gf,ga){ r.p++; r.gf+=gf; r.ga+=ga; if(gf>ga){r.w++;r.pts+=3} else if(gf===ga){r.d++;r.pts+=1} else r.l++; }
function standings(){ return [...S.cup.rows].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.tb-a.tb); }
function aiGroupOther(day){
  const [x,y] = ({1:['B','C'],2:['A','C'],3:['A','B']})[day];
  const t = id => S.cup.group['ABC'.indexOf(id)], X=t(x), Y=t(y);
  const rgb = SPORT.id==='rugby';
  const gx = rgb ? rgPoints(X.att,Y.def,.72).pts : poisson(clamp(1.3*Math.pow(X.att/Y.def,EXP),.2,5.5));
  const gy = rgb ? rgPoints(Y.att,X.def,.72).pts : poisson(clamp(1.3*Math.pow(Y.att/X.def,EXP),.2,5.5));
  return {a:x,b:y,ga:gx,gb:gy,an:X.name,bn:Y.name};
}
function applyGroup(L){
  const R = id => S.cup.rows.find(r=>r.id===id);
  addResult(R('me'),L.gf,L.ga); addResult(R(['A','B','C'][S.day-1]),L.ga,L.gf);
  if(L.other){ addResult(R(L.other.a),L.other.ga,L.other.gb); addResult(R(L.other.b),L.other.gb,L.other.ga); }
}
function shootout(en){
  const gk = (en.find(e=>e.slot.pos==='GK')||{eff:55}).eff;
  const og = S.opp.xi.find(p=>p.pos==='GK'), ogr = og ? (og.inj>0?55:og.rating) : 60;
  const pMe = clamp(0.72-(ogr-70)/250,.55,.85), pOpp = clamp(0.72-(gk-70)/250,.55,.85);
  let me=0, opp=0; const kicks=[];
  for(let i=0;i<5;i++){ const a=rnd()<pMe, b=rnd()<pOpp; if(a)me++; if(b)opp++; kicks.push({m:a,o:b}); }
  let sd=0;
  while(me===opp){
    sd++; let a=rnd()<pMe, b=rnd()<pOpp;
    if(sd>=5 && a===b){ a=rnd()<.5; b=!a; }          // cap sudden death at 5 rounds
    if(a)me++; if(b)opp++; kicks.push({m:a,o:b});
  }
  return {me,opp,kicks};
}

      <div class="tabs" style="margin-top:10px">${chip('all','All modes')}${chip('easy','Easy')}${chip('hard','Hard')}</div>
      <div class="tabs" style="margin-top:10px">${cchip('all','All leagues')}${cchip('worldcup','World Cup')}${cchip('pl','Premier League')}${cchip('rugby','Rugby')}</div>

      <div class="row" style="margin-top:14px;max-width:360px"><button class="btn sec" data-act="lbclear">${S.lbConfirm?'Tap again to clear all scores':'Clear scores'}</button></div>

function endTournament(){
  const L=S.last, c=S.cup; let rank;
  if(S.day<=3) rank=1; else if(S.day===4) rank=2; else if(S.day===5) rank=3; else if(S.day===6) rank=4; else rank = L.res==='W'?6:5;
  c.rank=rank; c.place=STAGE_RANK[rank];
  try{ const b=+localStorage.getItem('dm_cup_best')||0; if(rank>b) localStorage.setItem('dm_cup_best',rank); }catch(e){}
  submitRun();
  S.phase='end'; S.modal=null; render();
}

function simulateDay(){
  const rg = SPORT.id==='rugby', cup = S.format==='cup', LEN = SPORT.len;
  const en = buildLineup();
  const st = strength(en), opp = S.opp;
  const players = en.filter(e=>e.p);
  const stats = {}; players.forEach(e=>stats[e.p.id]={e,p:e.p,g:0,a:0,kp:0,pts:0});
  const evs = []; let gf, ga;
  const tw = {PR:.4,HK:1,LK:.6,FL:1.5,N8:2,SH:1,FH:1,CE:2,WG:3,FB:1.6};
  const kw = {FH:6,FB:2,SH:1,CE:.8,WG:.1,PR:.02,HK:.05,LK:.02,FL:.02,N8:.02};
  if(!rg){
    const lf = clamp(1.3*Math.pow(st.att/opp.def,EXP),0.2,5.5);
    const la = clamp(1.3*Math.pow(opp.att/st.def,EXP),0.2,5.5);
    gf = poisson(lf); ga = poisson(la);
    const sw = {FWD:4,MID:1.6,DEF:.5,GK:.02}, aw = {FWD:2,MID:3,DEF:1,GK:.05};
    for(let i=0;i<gf;i++){
      const sc = weighted(players, e=>sw[e.slot.pos]*Math.pow(e.eff/70,3)*(1+0.06*e.p.form));
      let as = null;
      if(rnd()<0.7 && players.length>1){
        as = weighted(players.filter(e=>e!==sc), e=>aw[e.slot.pos]*Math.pow(e.eff/70,2));
      }
      stats[sc.p.id].g++; if(as) stats[as.p.id].a++;
      evs.push({m:ri(2,LEN),t:'for',sc:sc.p,as:as?as.p:null});
    }
    for(let i=0;i<ga;i++){
      const fit = opp.xi.filter(p=>p.inj===0);
      const sc = weighted(fit, p=>sw[p.pos]*Math.pow(p.rating/70,3)*(1+0.06*p.form));
      evs.push({m:ri(2,LEN),t:'ag',sc});
    }
  } else {
    const fhE = en.find(e=>e.slot.pos==='FH'), ofh = opp.xi.find(p=>p.pos==='FH');
    const kMe = clamp(.72+((fhE?fhE.eff:55)-70)/200,.55,.88), kOpp = clamp(.72+((ofh&&ofh.inj===0?ofh.rating:55)-70)/200,.55,.88);
    const F = rgPoints(st.att,opp.def,kMe), A = rgPoints(opp.att,st.def,kOpp);
    gf = F.pts; ga = A.pts;
    const fit = opp.xi.filter(p=>p.inj===0);
    const tries = [];
    for(let i=0;i<F.t;i++){ const sc=weighted(players,e=>tw[e.slot.pos]*Math.pow(e.eff/70,3)*(1+.06*e.p.form)); const m=ri(2,LEN); tries.push(m); stats[sc.p.id].g++; evs.push({m,t:'for',k:'try',v:5,sc:sc.p}); }
    for(let i=0;i<F.c;i++){ const kk=weighted(players,e=>kw[e.slot.pos]*Math.pow(e.eff/70,2)); stats[kk.p.id].kp+=2; evs.push({m:tries[i],t:'for',k:'con',v:2,sc:kk.p}); }
    for(let i=0;i<F.p;i++){ const kk=weighted(players,e=>kw[e.slot.pos]*Math.pow(e.eff/70,2)); stats[kk.p.id].kp+=3; evs.push({m:ri(2,LEN),t:'for',k:'pen',v:3,sc:kk.p}); }
    const oTries = [];
    for(let i=0;i<A.t;i++){ const sc=weighted(fit,p=>tw[p.pos]*Math.pow(p.rating/70,3)); const m=ri(2,LEN); oTries.push(m); evs.push({m,t:'ag',k:'try',v:5,sc}); }
    for(let i=0;i<A.c;i++){ const sc=weighted(fit,p=>kw[p.pos]*Math.pow(p.rating/70,2)); evs.push({m:oTries[i],t:'ag',k:'con',v:2,sc}); }
    for(let i=0;i<A.p;i++){ const sc=weighted(fit,p=>kw[p.pos]*Math.pow(p.rating/70,2)); evs.push({m:ri(2,LEN),t:'ag',k:'pen',v:3,sc}); }
  }
  evs.sort((a,b)=>a.m-b.m);

  /* rugby knockout: level after 80 minutes goes to a golden-point penalty */
  let golden = null;
  if(rg && cup && S.day>=4 && gf===ga){
    const pw = clamp(.5+((st.att-opp.def)+(st.def-opp.att))/60,.3,.7), won = rnd()<pw;
    golden = {won};
    const sc = won ? weighted(players,e=>kw[e.slot.pos]*Math.pow(e.eff/70,2)).p : (opp.xi.find(p=>p.pos==='FH'&&p.inj===0) || opp.xi.find(p=>p.inj===0));
    if(won){ gf+=3; stats[sc.id].kp+=3; } else ga+=3;
    evs.push({m:ri(81,86),t:won?'for':'ag',k:'pen',v:3,sc});
  }

  const goalPts = {FWD:4,MID:5,DEF:6,GK:8};
  const win = gf>ga;
  let total = 0;
  players.forEach(e=>{
    const s = stats[e.p.id], pos = e.slot.pos;
    let pts = e.cover?1:2;
    if(!rg){
      if(ga===0){ if(pos==='GK'||pos==='DEF') pts+=4; else if(pos==='MID') pts+=1; }
      else if(pos==='GK'||pos==='DEF') pts -= Math.min(ga,3);
      if(win) pts+=1;
      pts += s.g*goalPts[pos] + s.a*3;
    } else {
      if(win) pts+=1;
      if(ga<=10 && (RG_FWD.includes(pos)||pos==='FB')) pts+=2;   // strong defensive display
      pts += s.g*8 + s.kp;
    }
    s.pts = pts; total += pts;
    e.p.pts += pts; e.p.gp++;
  });

  /* fatigue, recovery, price drift */
  const playedIds = new Set(players.map(e=>e.p.id));
  const recovered = [];
  Object.values(S.squad).forEach(p=>{
    if(playedIds.has(p.id)) p.consec++; else p.consec=0;
    if(p.inj>0){ p.inj--; if(p.inj===0) recovered.push(p); }
  });
  players.forEach(e=>{
    const pts = stats[e.p.id].pts;
    e.p.price = Math.max(0.5, r1(e.p.price*(pts>=9?1.12:pts<=2?0.93:1)));
  });

  /* injuries */
  const newInj = [];
  players.forEach(e=>{
    if(newInj.length>=2) return;
    if(rnd() < e.p.risk){ e.p.inj = ri(2,4); newInj.push(e.p); }
  });

  let res = win?'W':gf===ga?'D':'L', pens = null, other = null;
  if(!rg && cup && S.day>=4 && res==='D'){ pens = shootout(en); res = pens.me>pens.opp ? 'W' : 'L'; }
  if(cup && S.day<=3) other = aiGroupOther(S.day);
  if(!rg && !cup && res==='D') pens = shootout(en);          // football season: a drawn match is settled on penalties
  const pensWon = !!(pens && pens.me>pens.opp);
  const pay = (cup && S.day>=4) ? (res==='W' ? KO_PAY[S.day] : 2) : (!cup && !rg && res==='D' ? (pensWon?4:3) : PAY[res]);
  S.last = {res, pay, pens, golden, other, applied:false, opp, gf, ga, evs, total, stats:Object.values(stats).sort((a,b)=>b.pts-a.pts), newInj, recovered};
  S.queue = [...newInj];
}

function runLive(){
  S.step='match'; S.minute=0; render();
  clearInterval(timer);
  timer = setInterval(()=>{
    S.minute++;
    if(S.minute>=SPORT.len){ if(S.last.pens) startPens(); else finishMatch(); } else renderLive();
  }, 45);
}
function finishMatch(){
  clearInterval(timer); S.minute=SPORT.len; S.step='result';
  const L = S.last;
  if(!L.applied){
    L.applied = true;
    S.rec[L.res.toLowerCase()]++; S.points += L.total;
    S.tablePts += L.res==='W'?3:L.res==='D'?(1+((S.format!=='cup'&&L.pens&&L.pens.me>L.pens.opp)?1:0)):0;
    S.budget = r1(S.budget + L.pay);
    if(S.format==='cup' && S.day<=3){ applyGroup(L); if(S.day===3) S.cup.qualified = standings().findIndex(r=>r.me)<2; }
  }
  if(S.queue.length) S.modal = {type:'inj', p:S.queue[0]};
  render();
}

/* ---------- actions ---------- */
function act(a, el){
  if(S.spinning) return;
  const id = el && el.dataset.id ? +el.dataset.id : null;
  switch(a){
    case 'scout':
      if(S.phase!=='draft'){ if(!S.window||S.window.scouts<1) return toast('No scouts left in this window'); S.window.scouts--; }
      startSpin(); return;
    case 'mode': S.mode = el.dataset.m==='hard'?'hard':'easy'; break;
    case 'freespin': startSpin(); return;
    case 'rescout':
      if(S.mode==='hard') return toast('No re-spins in Hard mode');
      if(S.phase!=='draft') return;
      if(S.rerolls<1) return toast('No re-scouts left');
      S.rerolls--; startSpin(); return;
    case 'era': {
      const p=el.dataset.p, last=YEARS.length-1;
      S.era = p==='all' ? {lo:0,hi:last} : {lo:eraFrom(+p),hi:last};
      break;
    }
    case 'closepool': S.pool=null; S.sel=null; break;
    case 'closewindow': S.step='ready'; S.window=null; S.pool=null; S.sel=null; break;
    case 'pick': {
      const p = findPlayer(id); if(!p) return;
      if(owned(p)) return toast(p.name+' is already in your squad');
      if(S.phase==='draft'){
        if(noSpot(p)) return toast('No open '+p.pos+' spot left — sell someone first');
        if(p.price > S.budget-(empties()-1)) return toast('Too expensive — keep €1M per empty spot');
      }
      S.sel = S.sel===id ? null : id; break;
    }
    case 'slot': {
      const sid = el.dataset.sid, s = ALL.find(x=>x.id===sid), occ = S.squad[sid];
      if(selPlayer() && eligible(s)) { place(s); break; }
      if(occ){ S.modal = {type:'player', sid}; break; }
      return toast(selPlayer() ? 'That spot doesn\'t fit this position' : 'Scout a player first, then tap a highlighted spot');
    }
    case 'startseason':
      S.phase='season'; S.day=1; S.step='ready'; S.pool=null; S.sel=null; initCup(); S.opp=oppFor(1); break;
    case 'comp': { const id=el.dataset.c; if(COMPS[id]){ S.comp=id; setComp(id); S.era={lo:0,hi:YEARS.length-1}; } break; }
    case 'format': S.format = el.dataset.f==='cup'?'cup':'season'; break;
    case 'claim':
      if(Date.now()<S.rewardAt) return toast('Reward not ready yet');
      S.budget = r1(S.budget+REWARD_CASH); S.rewardAt = Date.now()+REWARD_MS;
      toast(`+${fmt(REWARD_CASH)} cash`); break;
    case 'kickoff': simulateDay(); S.pool=null; S.sel=null; runLive(); return;
    case 'skip': finishMatch(); return;
    case 'next':
      if(S.format==='cup'){
        const L=S.last;
        if((S.day===3 && !S.cup.qualified) || (S.day>=4 && L.res==='L') || S.day>=7){ endTournament(); return; }
      }
      S.day++;
      if(S.day>S.days){ submitRun(); S.phase='end'; try{ const b=+localStorage.getItem('dm_best2')||0; if(S.tablePts>b) localStorage.setItem('dm_best2',S.tablePts);}catch(e){} }
      else {
        S.opp=oppFor(S.day); S.pool=null; S.sel=null;
        if(isWindowDay(S.day)){ S.window={scouts:S.mode==='hard'?2:3, transfers:2}; S.step='window'; }
        else { S.window=null; S.step='ready'; }
      }
      break;
    case 'closemodal': S.modal=null; break;
    case 'sell': {
      if(S.phase==='season' && S.step!=='window') return toast('Selling opens in the next transfer window');
      const sid = S.modal.sid, p = S.squad[sid];
      S.budget = r1(S.budget+sellValue(p)); delete S.squad[sid]; S.modal=null;
      toast(`Sold ${p.name} for ${fmt(sellValue(p))}`); break;
    }
    case 'treat': {
      const p = S.modal.type==='inj' ? S.modal.p : S.squad[S.modal.sid], c = treatCost(p);
      if(S.budget<c) return toast('Not enough cash');
      S.budget = r1(S.budget-c); p.inj=0; toast(`${p.name} treated — fit for the next match`);
      advanceQueue(); break;
    }
    case 'rest': advanceQueue(); break;
    case 'sellinj': {
      const p = S.modal.p, sid = slotOf(p);
      S.budget = r1(S.budget+sellValue(p)); delete S.squad[sid];
      toast(`Sold ${p.name} — scout a replacement`);
      advanceQueue(); break;
    }
    case 'again': newGame('draft', S.league); return;
    case 'home': newGame('home'); return;
    case 'leaderboard': S.lbTab = el.dataset.t || S.lbTab || 'season'; S.lbMode = S.lbMode || 'all'; S.phase='leaderboard'; S.modal=null; break;
    case 'lbtab': S.lbTab = el.dataset.t==='cup'?'cup':'season'; S.lbConfirm=false; break;
    case 'lbcomp': S.lbComp = ['worldcup','pl','rugby'].includes(el.dataset.c)?el.dataset.c:'all'; break;
    case 'lbmode': S.lbMode = ['easy','hard'].includes(el.dataset.m)?el.dataset.m:'all'; break;
    case 'lbclear':
      if(!S.lbConfirm){ S.lbConfirm=true; break; }
      lbSave({season:[],cup:[]}); S.lbConfirm=false; S.lbId=null; toast('Leaderboards cleared'); break;
    case 'startgame': S.pending=null; S.phase='setup'; break;
    case 'begin': newGame('draft', S.pending||null); return;
    case 'createleague': {
      const f=S.form, code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[ri(0,23)]).join('')+'-'+ri(10,99);
      S.league={name:(f.name||'').trim()||(S.teamName||'My')+' League', days:f.days, budget:f.budget, code, host:true,
        members:[{n:S.teamName||'My XI',me:true,host:true}]};
      S.phase='league'; break;
    }
    case 'joinleague': {
      const code=(S.form.code||'').trim().toUpperCase();
      if(code.length<3) return toast('Enter an invite code first');
      S.league={name:'Sunday Legends', days:10, budget:88, code, host:false,
        members:[{n:'Sam',host:true},{n:'Alex'},{n:S.teamName||'My XI',me:true}]};
      S.phase='league'; break;
    }
    case 'simfriend': {
      const L=S.league, used=new Set(L.members.map(m=>m.n));
      const n=FRIENDS.find(x=>!used.has(x)); if(!n||L.members.length>=8) return toast('League is full');
      L.members.push({n}); toast(n+' joined your season'); break;
    }
    case 'copylink': {
      const link='https://draftmanager.example/join/'+S.league.code;
      try{ navigator.clipboard.writeText(link).then(()=>toast('Invite link copied'),()=>toast('Copy blocked — select the link instead')); }
      catch(e){ toast('Copy blocked — select the link instead'); }
      return;
    }
    case 'startleague': S.pending=S.league; S.phase='setup'; break;
  }
  render();
}
function advanceQueue(){
  S.queue.shift();
  S.modal = S.queue.length ? {type:'inj', p:S.queue[0]} : null;
}
function place(s){
  const p = selPlayer(), old = S.squad[s.id];
  if(S.phase==='draft'){
    if(S.budget-p.price < empties()-1) return toast('Not enough budget left for the rest of the squad');
    S.budget = r1(S.budget-p.price);
  } else {
    if(!S.window || S.window.transfers<1) return toast('No transfers left in this window');
    const refund = old ? sellValue(old) : 0;
    if(S.budget+refund < p.price) return toast('Not enough cash');
    S.budget = r1(S.budget+refund-p.price);
    if(old) toast(`${old.name} sold for ${fmt(refund)}`);
  }
  if(S.phase!=='draft') S.window.transfers--;
  S.squad[s.id] = p; S.pool=null; S.sel=null;
}
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(id==='tname') S.teamName = e.target.value.slice(0,20);
  else if(id==='lname') S.form.name = e.target.value.slice(0,28);
  else if(id==='jcode') S.form.code = e.target.value.slice(0,10);
  else if(id==='eraLo' || id==='eraHi'){
    let lo=+document.querySelector('#eraLo').value, hi=+document.querySelector('#eraHi').value;
    if(id==='eraLo' && lo>hi){ lo=hi; e.target.value=lo; }
    if(id==='eraHi' && hi<lo){ hi=lo; e.target.value=hi; }
    S.era={lo,hi}; updateEraUI();
  }
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d && d.dataset && d.dataset.k){ S.ui=S.ui||{}; S.ui[d.dataset.k]=d.open; } }, true);
document.addEventListener('change', e=>{
  if(e.target.id==='ldays') S.form.days = +e.target.value;
  if(e.target.id==='lbudget') S.form.budget = +e.target.value;
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(el) act(el.dataset.act, el);
});

/* ---------- rendering ---------- */
function marksSVG(){
  return `<svg class="mk" viewBox="0 0 100 110" preserveAspectRatio="none" fill="none" stroke="#d9141b" stroke-width=".5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="94" height="104"/><line x1="3" y1="55" x2="97" y2="55"/>
    <circle cx="50" cy="55" r="10"/><circle cx="50" cy="55" r=".7" fill="#d9141b"/>
    <rect x="27" y="3" width="46" height="17"/><rect x="39" y="3" width="22" height="7"/>
    <rect x="27" y="90" width="46" height="17"/><rect x="39" y="100" width="22" height="7"/>
    <path d="M40 20 A10 10 0 0 0 60 20"/><path d="M40 90 A10 10 0 0 1 60 90"/></svg>`;
}
function slotHTML(s){
  const p = S.squad[s.id], elig = eligible(s);
  const cls = ['slot']; if(!p) cls.push('empty'); if(elig) cls.push('elig'); if(p&&p.inj>0) cls.push('inj');
  const tierFill = r => r>=85?'#e7b416':r>=78?'#3cb371':r>=70?'#4a90e2':'#9aa0a6';
  const fill = p ? tierFill(p.rating) : (elig ? 'rgba(217,20,27,.12)' : '#cfcfcf');
  const shirt = `<svg viewBox="0 0 60 56" aria-hidden="true"><path d="M20 3 L4 11 L1 27 L12 31 L14 24 L14 53 L46 53 L46 24 L48 31 L59 27 L56 11 L40 3 C37 9 23 9 20 3Z" fill="${fill}" ${p?'stroke="rgba(0,0,0,.22)" stroke-width="1"':''} ${elig?'stroke="#d9141b" stroke-width="2" stroke-dasharray="4 3"':''}/><path d="M20 3 C23 9 37 9 40 3" fill="none" stroke="#d9141b" stroke-width="3"/></svg>`;
  const surname = p ? p.name.replace(/^\\S+\\s/,'') : s.label;
  return `<button class="${cls.join(' ')}" style="left:${s.x}%;top:${s.y}%" data-act="slot" data-sid="${s.id}"><span class="shirt">${shirt}<b>${p?p.rating:''}</b></span><span class="nm">${surname}</span>${p&&p.inj>0?`<i class="ib" title="Out for ${p.inj} matches">${p.inj}</i>`:''}</button>`;
}
function rugbyMarksSVG(){

    <rect x="3" y="3" width="94" height="116"/>
    <line x1="3" y1="12" x2="97" y2="12"/><line x1="3" y1="110" x2="97" y2="110"/>
    <line x1="3" y1="35" x2="97" y2="35"/><line x1="3" y1="87" x2="97" y2="87"/>
    <line x1="3" y1="61" x2="97" y2="61"/>
    <line x1="3" y1="50" x2="97" y2="50" stroke-dasharray="3 3"/><line x1="3" y1="72" x2="97" y2="72" stroke-dasharray="3 3"/>
    <line x1="10" y1="12" x2="10" y2="110" stroke-dasharray="3 3"/><line x1="90" y1="12" x2="90" y2="110" stroke-dasharray="3 3"/>
    <path d="M46 12 V6 M54 12 V6 M46 8.5 H54"/><path d="M46 110 V116 M54 110 V116 M46 113.5 H54"/>
    <circle cx="50" cy="61" r=".7" fill="#d9141b"/></svg>`;
}
function pitchHTML(){
  const key = [['#e7b416','Legend 85+'],['#3cb371','Great 78–84'],['#4a90e2','Good 70–77'],['#9aa0a6','Average']]
    .map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('');
  const rg = SPORT.id==='rugby';
  return `<div class="pitch ${rg?'rugby':''}" style="--pr:${rg?1.22:1.1}">${rg?rugbyMarksSVG():marksSVG()}${MAIN.map(s=>slotHTML(s)).join('')}</div><div class="tierkey">${key}</div>`;
}
function fmtT(ms){ const t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), c=t%60, p=n=>String(n).padStart(2,'0'); return (h?h+':':'')+p(m)+':'+p(c); }
function rewardHTML(){
  const left = S.rewardAt - Date.now();
  return `<div class="reward"><div><b>Daily reward</b> <span class="muted small">+${fmt(REWARD_CASH)} cash</span></div>
    <button class="btn sm" id="rbtn" data-act="claim" ${left>0?'disabled':''}><span id="rtxt">${left>0?'Next in '+fmtT(left):'Claim'}</span></button></div>`;
}
setInterval(()=>{
  if(!S || S.phase!=='season') return;
  const b=$('#rbtn'), t=$('#rtxt'); if(!b||!t) return;
  const left=S.rewardAt-Date.now();
  t.textContent = left>0 ? 'Next in '+fmtT(left) : 'Claim';
  b.disabled = left>0;
}, 500);
function statsHTML(){
  const st=(l,v,c='')=>`<div class="stat ${c}"><span>${l}</span><b>${v}</b></div>`;
  if(S.phase==='draft'){
    const n=ALL.length-empties();
    return `<div class="stats">${st('Cash',fmt(S.budget))}${S.mode==='hard'?st('Mode','Hard'):st('Re-spins',S.rerolls)}${st('Squad',n+'/'+ALL.length)}</div>`;
  }
  const w = (S.step==='window' && S.window) ? st('Scouts',S.window.scouts)+st('Transfers',S.window.transfers) : '';
  return `<div class="stats">${S.format==='cup'?st('Stage',stageName(S.day)):st('Match',Math.min(S.day,S.days)+'/'+S.days)}${st('Cash',fmt(S.budget))}${w}${st('Record',S.rec.w+'-'+S.rec.d+'-'+S.rec.l)}${S.format==='cup'?'':st('Points',S.tablePts,'hi')}${st('Player pts',S.points)}</div>`;
}
function rowHTML(p){
  const has = owned(p);
  const dis = has || (S.phase==='draft' && (noSpot(p) || p.price > S.budget-(empties()-1)));
  const hid = `Risk <b>${riskLabel(p.risk)}</b> · Form <b>${formSym(p.form)}</b>`;
  return `<div class="prow ${S.sel===p.id?'sel':''} ${dis?'dis':''}" data-act="pick" data-id="${p.id}">
    <span class="pos">${p.pos}</span><span class="orb sm ${rc(p.rating)}">${p.rating}</span>
    <span class="pn">${COMP.id==='pl'?p.flag+' ':''}${p.name}</span><span class="pr">${has?'<span class="small muted">In your squad</span>':fmt(p.price)}</span>
    <span class="hid">${hid}</span></div>`;
}
function reelsHTML(t,y,cls){
  return `<div class="reels ${cls||''}"><div class="reel" id="reelT">${t}</div><div class="reel sm" id="reelY">${y}</div></div>`;
}
function windowPanel(){
  const w=S.window;
  return `<div class="card"><div class="tag">Transfer window</div><h2>Before ${S.format==='cup'?'the '+stageName(S.day):'match '+S.day}</h2>
    <p class="muted small" style="margin:0 0 12px">Scout a squad, sign one player (a transfer), or sell players from the pitch. Everyone gets the same allowance. Unused scouts and transfers do not carry over.</p>
    <div class="stats" style="margin-bottom:14px"><div class="stat"><span>Scouts left</span><b>${w.scouts}</b></div><div class="stat"><span>Transfers left</span><b>${w.transfers}</b></div></div>
    <button class="btn" data-act="closewindow">Close window and play ${S.format==='cup'?'the '+stageName(S.day):'match '+S.day}</button></div>`;
}
function scoutPanel(){
  const draft = S.phase==='draft', w = S.window;
  if(S.spinning) return `<div class="card">${reelsHTML('…','…','spin')}<div class="muted small" style="text-align:center;margin-top:10px">Scouting…</div></div>`;
  if(!S.pool){
    const narrowed = !(S.era.lo===0&&S.era.hi===YEARS.length-1);
    const blurb = draft
      ? `Spin for ${COMP.spin}. You see the whole squad. Sign one player.`+(S.mode==='hard'?' Hard mode: no re-spins.':'')
      : `Spin for a squad, then sign one player. Signing into an occupied spot sells the old player at 90%.`;
    return `<div class="card"><h2>${draft?'Scout your squad':'Scout the market'}</h2>
      <p class="muted" style="margin:0 0 14px">${blurb}${narrowed?` Era: ${eraLabel()}.`:''}</p>
      ${reelsHTML('Team',COMP.yearWord)}
      <button class="btn" style="margin-top:14px" data-act="scout" ${(!draft&&(!w||w.scouts<1))?'disabled':''}>Scout${draft?'':` (${w?w.scouts:0} left)`}</button></div>`;
  }
  const P = S.pool, hard = S.mode==='hard';
  const stuck = draft && !P.players.some(p=>!owned(p) && !noSpot(p) && p.price<=S.budget-(empties()-1));
  let spinBtn = '';
  if(stuck) spinBtn = `<button class="btn sec" data-act="freespin">Nothing signable. Spin again (free)</button>`;
  else if(draft && !hard) spinBtn = `<button class="btn sec" data-act="rescout" ${S.rerolls<1?'disabled':''}>Re-spin (${S.rerolls} left)</button>`;
  const closeBtn = draft ? '' : '<button class="btn sec" data-act="closepool">Close</button>';
  const rowBtns = (spinBtn||closeBtn) ? `<div class="row">${spinBtn}${closeBtn}</div>` : '';
  return `<div class="card">${reelsHTML(P.nat.f+' '+P.nat.n, ylabel(P.year), 'landed')}
    <div class="muted small" style="margin:12px 0 4px">${S.sel?'Now tap a highlighted spot on the pitch.':'Pick one player from this squad.'}</div>
    ${P.players.map(rowHTML).join('')}
    ${rowBtns}${hard&&draft&&!stuck?'<div class="muted small" style="margin-top:10px">Hard mode: no re-spins. Pick from this squad.</div>':''}</div>`;
}
function oppPanel(){
  const en = buildLineup(), st = strength(en), o = S.opp;
  const outs = en.filter(e=>e.out), uncovered = en.filter(e=>!e.p);
  let warn = '';
  if(outs.length) warn = `<div class="small" style="margin-top:8px;color:var(--warn);font-weight:700">${outs.map(e=>e.out.name).join(', ')} injured — a free rating-55 reserve fills in and scores nothing</div>`;
  if(uncovered.length && !outs.length) warn = `<div class="small" style="margin-top:8px;color:var(--warn);font-weight:700">Empty spot: ${uncovered.map(e=>e.slot.label).join(', ')}</div>`;
  const xi = SPORT.groups.map(([lab,list])=>`<div class="xirow"><span class="pos">${lab}</span>${o.xi.filter(p=>list.includes(p.pos)).map(p=>`<span class="xp ${p.inj?'out':''}">${p.flag} ${p.name.replace(/^\S+\s/,'')} <b>${p.inj?'🩹'+p.inj:p.rating}</b></span>`).join('')}</div>`).join('');
  const outN = o.xi.filter(p=>p.inj>0).length;
  const od = matchOdds(st,o);
  return `<div class="card"><div class="tag">${S.format==='cup'?stageLabel(S.day):'Match '+S.day} · ${o.friend?'Friend (simulated)':'AI manager'}</div><h2>vs ${o.name}</h2>
    <div class="small muted">Strength ${o.ovr} · ${SPORT.x} cost ${fmt(o.cost)} · Form <b>${o.form.split('').map(c=>`<span class="fm f${c}">${c}</span>`).join('')}</b></div><div class="bar"><i style="width:${clamp((o.ovr-55)*3.2,5,100)}%"></i></div>
    <div style="margin-top:10px">${xi}</div>
    <div class="small" style="margin-top:10px"><b>${Math.round(od.w*100)}%</b> win · ${Math.round(od.d*100)}% draw · ${Math.round(od.l*100)}% loss</div>
    <div class="odds"><i style="width:${od.w*100}%;background:var(--r-green)"></i><i style="width:${od.d*100}%;background:var(--r-gray)"></i><i style="width:${od.l*100}%;background:var(--bad)"></i></div>
    ${outN?`<div class="small" style="margin-top:6px;color:var(--warn);font-weight:700">${outN} of their starters ${outN>1?'are':'is'} injured — a weak reserve fills in</div>`:''}
    <div class="small muted" style="margin-top:10px">Your ${SPORT.x} · ATT ${Math.round(st.att)} · DEF ${Math.round(st.def)}</div>${warn}
    <button class="btn" style="margin-top:12px" data-act="kickoff">Kick off</button></div>`;
}
function liveHTML(){
  if(S.step==='pens') return pensHTML();
  const L = S.last, shown = L.evs.filter(e=>e.m<=S.minute);
  const gf = shown.filter(e=>e.t==='for').reduce((a,e)=>a+(e.v||1),0), ga = shown.filter(e=>e.t==='ag').reduce((a,e)=>a+(e.v||1),0);
  return `<div class="card"><div class="tag">Match ${S.day} · ${S.minute}'</div>
    <div class="score"><div>${gf}<small>${myName()}</small></div><span class="muted">–</span><div>${ga}<small>${L.opp.name}</small></div></div>
    <div class="bar"><i style="width:${S.minute/SPORT.len*100}%"></i></div>
    <div style="margin-top:8px">${shown.map(evHTML).join('')||'<div class="small muted">Waiting for the first chance…</div>'}</div>
    <button class="btn sec" style="margin-top:10px" data-act="skip">Skip</button></div>`;
}
function renderLive(){ const c=$('#live'); if(c) c.innerHTML = liveHTML(); }
function evHTML(e){
  if(e.k){
    const lab = {try:'Try',con:'Conversion',pen:'Penalty'}[e.k];
    return e.t==='for'
      ? `<div class="ev"><b>${e.m}'</b> ${lab} · ${e.sc.name}</div>`
      : `<div class="ev"><b>${e.m}'</b> ${lab} against · ${e.sc.flag} ${e.sc.name} <span class="muted">(${S.last.opp.name})</span></div>`;
  }
  return e.t==='for'
    ? `<div class="ev"><b>${e.m}'</b> Goal · ${e.sc.name} <span class="muted">${e.as?'(assist '+e.as.name+')':'(unassisted)'}</span></div>`
    : `<div class="ev"><b>${e.m}'</b> Conceded · ${e.sc.flag} ${e.sc.name} <span class="muted">(${S.last.opp.name})</span></div>`;
}
function resultHTML(){
  const L = S.last, r = L.res;
  const top = L.stats.slice(0,4).map(s=>`<div class="perf"><span>${s.p.name} <span class="muted">${s.e.slot.label}${s.g?` · ${s.g}${SPORT.id==='rugby'?'T':'G'}`:''}${s.a?` · ${s.a}A`:''}${s.kp?` · ${s.kp} kick pts`:''}</span></span><b>+${s.pts}</b></div>`).join('');
  const inj = L.newInj.map(p=>`<div class="small" style="margin-top:6px"><b>${p.name}</b> ${p.inj===0?'treated':`is out for ${p.inj} match${p.inj>1?'es':''}`}</div>`).join('');
  const rec = L.recovered.map(p=>`<div class="small" style="margin-top:6px"><b>${p.name}</b> is back from injury</div>`).join('');
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="tag">Full time · ${S.format==='cup'?stageLabel(S.day):'Match '+S.day}</div><span class="res ${r}">${L.pens?(L.pens.me>L.pens.opp?'WON ON PENALTIES':'LOST ON PENALTIES'):(r==='W'?'WIN':r==='D'?'DRAW':'LOSS')}</span></div>
    <div class="score"><div>${L.gf}<small>${myName()}</small></div><span class="muted">–</span><div>${L.ga}<small>${L.opp.name}</small></div></div>
    ${L.pens?`<div style="text-align:center;font-weight:700;margin-bottom:6px">${L.gf}–${L.ga} after ${SPORT.len} minutes · penalties ${L.pens.me}–${L.pens.opp}</div>`:''}
    ${L.golden?`<div style="text-align:center;font-weight:700;margin-bottom:6px">Level after ${SPORT.len} minutes · ${L.golden.won?'won':'lost'} on a golden-point penalty</div>`:''}
    <div style="text-align:center;font-weight:800;color:var(--ink)">${(S.format==='cup'&&S.day>=4)?'':tablePtsText(L)+' · '}+${fmt(L.pay)} cash · +${L.total} player pts</div>
    <div style="margin-top:10px">${L.evs.map(evHTML).join('')}</div></div>
    <div class="card"><h2>Top performers</h2>${top}${inj}${rec}</div>`;
}
function endHTML(){
  if(S.format==='cup') return cupEndHTML();
  const names = S.league ? S.league.members.filter(m=>!m.me).map(m=>m.n) : FRIENDS;
  const friends = names.map(n=>({n,s:Math.max(0,Math.round(1.65*S.days+randn()*3)),f:Math.round(43*S.days+randn()*60)}));
  const all = [...friends,{n:myName(),s:S.tablePts,f:S.points,me:true}].sort((a,b)=>b.s-a.s||b.f-a.f);
  const rank = all.findIndex(x=>x.me)+1;
  let best = 0; try{ best = +localStorage.getItem('dm_best2')||0; }catch(e){}
  const top = Object.values(S.squad).sort((a,b)=>b.pts-a.pts).slice(0,3)
    .map(p=>`<div class="perf"><span>${p.name} <span class="muted">${p.pos} · ${p.gp} apps</span></span><b>${p.pts} pts</b></div>`).join('');
  return `<div class="cols">
    <div><div class="card" style="text-align:center"><div class="tag">Season complete</div>
      <div class="score" style="font-size:64px">#${rank}</div>
      <div class="muted">${S.rec.w}W ${S.rec.d}D ${S.rec.l}L · <b>${S.tablePts} pts</b> · ${S.points} player points · best ever ${best}</div></div>
      ${lbLine()}<div class="row"><button class="btn" data-act="again">Play again</button><button class="btn sec" data-act="leaderboard" data-t="${S.format==='cup'?'cup':'season'}">Leaderboard</button><button class="btn sec" data-act="home">Home</button></div></div>
    <div><div class="card"><h2>${S.league?esc(S.league.name):'Friends league'} <span class="muted small">(simulated scores)</span></h2>${all.map((x,i)=>`<div class="lb ${x.me?'me':''}"><span>${i+1}. ${x.n} <span class="muted small">${x.f} player pts</span></span><b>${x.s} pts</b></div>`).join('')}
      <div class="small muted" style="margin-top:8px">3 for a win, 2 for a penalty win after a draw, 1 for a penalty loss. Player points break ties.</div></div>
      <div class="card"><h2>Your best performers</h2>${top}</div></div>
  </div>`;
}
function modalHTML(){
  const m = S.modal; if(!m) return '';
  if(m.type==='inj'){
    const p = m.p, c = treatCost(p);
    return `<div class="overlay"><div class="sheet">
      <div class="tag">Injury report</div>
      <h3>${p.name} (${p.pos}, ${p.rating}) is hurt</h3>

      <div class="opt"><button class="btn" data-act="treat" ${S.budget<c?'disabled':''}>Treat — ${fmt(c)} · back next match</button></div>
      <div class="opt"><button class="btn sec" data-act="rest">Rest — free · out ${p.inj} match${p.inj>1?'es':''}</button></div>

  return `<div class="overlay"><div class="sheet">

    ${(S.phase==='draft'||S.step==='window')
      ? `<div class="opt"><button class="btn sec" data-act="sell">Sell for ${fmt(sellValue(p))}${S.phase==='season'?' (90%)':''}</button></div>`

    <div class="opt"><button class="btn sec" data-act="closemodal">Close</button></div></div></div>`;
}

          <svg viewBox="0 0 140 120" width="170" height="145"><path d="M48 6 L22 18 L4 50 L28 62 L38 48 L38 112 L102 112 L102 48 L112 62 L136 50 L118 18 L92 6 Q70 30 48 6Z" fill="#14503f"/><path d="M48 6 Q70 30 92 6" fill="none" stroke="#f4f98f" stroke-width="4"/><text x="70" y="86" text-anchor="middle" font-size="34" font-weight="800" fill="#f4f98f" font-family="inherit">${star.rating}</text></svg>
          <div class="n">${star.name}</div><div class="s">${star.nat} · ${ylabel(star.year)}</div></div>
        <div class="btag"><b>Starting budget €88M</b><small>Spin a team and a year</small></div>
      </div>
    </section>

    <section id="how" class="how"><h2>How it works</h2>
      ${step(1,'Scout','Spin a team and a year from World Cup, Premier League or rugby history. You see the whole squad and sign one player. Easy mode lets you re-spin; Hard does not.')}
      ${step(2,'Draft','Fill every spot inside your budget (11 in football, 15 in rugby). Rating, price, injury risk and form are all in plain sight.')}
      ${step(3,'Play','Play a 10-match season, where draws go to penalties, or a cup run: groups, then knockouts. Every result pays cash, injuries cost real money, and transfer windows open between stages.')}
    </section>

    <section id="friends" class="how friends"><div><h2>Play with friends</h2><p class="muted small" style="margin:8px 0 0;max-width:30ch">Run your own season and share an invite link.</p></div>
      <div class="card"><b>Create a season</b>
        <div class="lbl2" style="margin-top:14px">Season name</div>
        <input class="inp" id="lname" maxlength="28" placeholder="${esc(S.teamName||'My')} League" value="${esc(f.name)}">
        <div class="two" style="margin-top:12px">
          <div><div class="lbl2" style="margin:0 0 6px">Length</div><select class="inp" id="ldays">${[7,10,14,30].map(d=>`<option value="${d}" ${f.days===d?'selected':''}>${d} matches</option>`).join('')}</select></div>
          <div><div class="lbl2" style="margin:0 0 6px">Budget</div><select class="inp" id="lbudget">${[75,88,100].map(b=>`<option value="${b}" ${f.budget===b?'selected':''}>€${b}M</option>`).join('')}</select></div>
        </div>
        <button class="btn" style="margin-top:14px" data-act="createleague">Create season</button></div>
      <div class="card"><b>Have an invite code?</b>
        <div class="lbl2" style="margin-top:14px">Invite code</div>
        <div class="inrow"><input class="inp" id="jcode" maxlength="10" placeholder="e.g. KQTR-42" value="${esc(f.code)}"><button class="btn sec" style="width:auto;padding:0 22px" data-act="joinleague">Join</button></div></div>
    </section>
    <div class="foot"><a href="#play">Back to top</a></div>
    </div>`;
}
function setupHTML(){
  const L=S.pending, hard=S.mode==='hard', cup=S.format==='cup';
  return `<div class="top"><button class="mini" data-act="home">Back</button><span class="tag">Step 1 of 2</span></div>
    <div class="cols setup">
      <div><h1 class="big" style="margin:20px 0 14px">Set up<br><span class="red">your draft.</span></h1>
        <p class="lead">Pick a league, a format, a mode and an era. Spins and AI squads only draw from ${COMP.eraWhat} in your range.</p>
        ${L?`<div class="muted small" style="margin-top:16px">${esc(L.name)} · ${L.days} matches · €${L.budget}M</div>`:''}</div>
      <div class="card" style="margin-top:20px">
        <div class="lbl2" style="margin-top:0">League</div>
        <div class="modes">
          ${Object.values(COMPS).map(c=>`<button class="mode ${S.comp===c.id?'on':''}" data-act="comp" data-c="${c.id}"><b>${c.name}</b><span>${c.blurb}</span></button>`).join('')}
        </div>
        ${L?'':`<div class="lbl2" style="margin-top:22px">Format</div>
        <div class="modes">
          <button class="mode ${cup?'':'on'}" data-act="format" data-f="season"><b>Season</b><span>10 matches. 3 points for a win. Draws go to penalties: 2 for the winner, 1 for the loser.</span></button>
          <button class="mode ${cup?'on':''}" data-act="format" data-f="cup"><b>${S.comp==='worldcup'?'World Cup':'Cup run'}</b><span>Group stage, then knockouts. Lose a knockout and you are out.</span></button>
        </div>`}
        <div class="lbl2" style="margin-top:22px">Mode</div>
        <div class="modes">
          <button class="mode ${hard?'':'on'}" data-act="mode" data-m="easy"><b>Easy</b><span>4 re-spins in the draft and 3 scouts in every transfer window.</span></button>
          <button class="mode ${hard?'on':''}" data-act="mode" data-m="hard"><b>Hard</b><span>No re-spins and 2 scouts per window. Every spin is final.</span></button>
        </div>
        <div class="lbl2" style="margin-top:22px">Era</div>
        ${eraHTML()}
        <button class="btn" style="margin-top:22px" data-act="begin">Begin draft</button></div>
    </div>`;
}
function leagueHTML(){
  const L=S.league, cap=8, empty=cap-L.members.length;
  const link='https://draftmanager.example/join/'+L.code;
  const mem=L.members.map(m=>`<div class="lb ${m.me?'me':''}"><span>${esc(m.n)}${m.host?' <span class="muted small">host</span>':''}${m.me?' <span class="muted small">you</span>':''}</span><span class="small" style="color:var(--good);font-weight:700">Ready</span></div>`).join('');
  const slots=Array.from({length:Math.min(empty,3)},()=>`<div class="lb muted">Waiting for a friend…</div>`).join('');
  return `<div class="top"><button class="mini" data-act="home">Back</button><span class="tag">Season lobby</span></div>
    <div class="cols">
      <div><h1 class="big" style="font-size:clamp(36px,6vw,64px);margin:20px 0 10px">${esc(L.name)}</h1>
        <div class="muted">${L.days} matches · €${L.budget}M budget · ${L.members.length}/${cap} managers</div>
        <div class="card" style="margin-top:20px"><h2>Invite friends</h2>
          <div class="linkbox">${link}</div>
          <div class="row"><button class="btn sec" data-act="copylink">Copy invite link</button></div>
          <div class="small muted" style="margin-top:10px">Mockup link. Code ${esc(L.code)}</div></div></div>
      <div><div class="card" style="margin-top:20px"><h2>Managers</h2>${mem}${slots}
        ${L.host?`<button class="btn sec" style="margin-top:12px" data-act="simfriend">Simulate a friend joining</button>`:''}</div>
        ${L.host
          ? `<button class="btn" style="margin-top:12px" data-act="startleague" ${L.members.length<2?'disabled':''}>${L.members.length<2?'Need at least 2 managers':'Start season'}</button>`
          : `<button class="btn" style="margin-top:12px" data-act="startleague">Simulate host starting the season</button>`}
        <div class="small muted" style="margin-top:10px;text-align:center">${L.host?'Everyone drafts a squad, then plays the same matches against each other.':'Waiting for the host to start.'}</div></div>
    </div>`;
}
function render(){
  $('#app').className = 'app' + (S.phase==='home' ? ' home' : ['draft','season'].includes(S.phase) ? ' wide' : ' page');
  if(S.phase==='home'){ $('#app').innerHTML=homeHTML(); $('#modal').innerHTML=''; return; }
  if(S.phase==='leaderboard'){ $('#app').innerHTML=leaderboardHTML(); $('#modal').innerHTML=''; return; }
  if(S.phase==='setup'){ $('#app').innerHTML=setupHTML(); $('#modal').innerHTML=''; return; }
  if(S.phase==='league'){ $('#app').innerHTML=leagueHTML(); $('#modal').innerHTML=''; return; }
  let h = `<div class="top"><button class="mini" data-act="home">Back</button><div class="namebar"><input id="tname" maxlength="20" placeholder="Name your squad" value="${esc(S.teamName)}" aria-label="Squad name"></div></div>`;
  if(S.phase==='end'){ h += endHTML(); }
  else {
    let side = '';
    if(S.phase==='draft'){
      side += scoutPanel();
      side += `<button class="btn" style="margin-top:10px" data-act="startseason" ${empties()?'disabled':''}>${empties()?`Fill ${empties()} more spot${empties()>1?'s':''} to start`:'Start season'}</button>`;
    } else if(S.step==='ready'){
      side += oppPanel() + cupGroupCard();
    } else if(S.step==='window'){
      side += windowPanel() + scoutPanel();
    } else if(S.step==='match'||S.step==='pens'){
      side += `<div id="live">${liveHTML()}</div>`;
    } else if(S.step==='result'){
      side += resultHTML() + cupExtraHTML() + nextBtn();
    }
    h += `<div class="statsbar">${statsHTML()}</div>${S.phase==='season'?rewardHTML():''}
      <div class="game"><div class="col-pitch">${pitchHTML()}</div><div class="col-side">${side}</div></div>`;
  }
  $('#app').innerHTML = h;
  $('#modal').innerHTML = modalHTML();
}
newGame('home');
</script>
</body>
</html>
